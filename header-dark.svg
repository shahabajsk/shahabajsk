<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Shahabaj Sheikh, forward-deployed AI engineer. Animation: a dispute moves through an agent's states; a fabricated amount is rejected at verify, redrafted, verified and shipped with zero fabrications.">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3a4a68"/></marker>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e6a54a"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="au1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#4cc198" stop-opacity="0.28"/><stop offset="1" stop-color="#4cc198" stop-opacity="0"/>
      <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="0.15;0.55;0.15"/>
    </radialGradient>
    <radialGradient id="au2" cx="0.9" cy="0.0" r="0.55">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.22"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
      <animate attributeName="cx" dur="20s" repeatCount="indefinite" values="0.9;0.5;0.9"/>
    </radialGradient>
    <clipPath id="card"><rect width="960" height="384" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="384" fill="#0f1726"/>
    <rect width="960" height="384" fill="url(#au1)"/>
    <rect width="960" height="384" fill="url(#au2)"/>
  </g>

  <text x="70" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#e6ebf3">Shahabaj Sheikh</text>
  <text x="70" y="124" font-size="20" font-weight="700" fill="#4cc198">Forward Deployed Engineer &amp; AI Solution Architect at DevRev</text>
  <text x="70" y="152" font-size="18" fill="#a3b0c6">Agentic systems from discovery to production, where a wrong answer has a cost.</text>
  <line x1="70" y1="176" x2="890" y2="176" stroke="#3a4a68"/>

  <line x1="172" y1="236" x2="188" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/><line x1="294" y1="236" x2="310" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/><line x1="416" y1="236" x2="432" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/><line x1="538" y1="236" x2="554" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/><line x1="660" y1="236" x2="676" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/><line x1="782" y1="236" x2="798" y2="236" stroke="#3a4a68" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="70" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"></rect><text x="119.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">intake</text><rect x="192" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"></rect><text x="241.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">gather</text><rect x="314" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"></rect><text x="363.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">classify</text><rect x="436" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"></rect><text x="485.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">draft</text><rect x="558" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.42;0.58;0.68" values="#a3b0c6;#f0806f;#a3b0c6;#4cc198;#a3b0c6"/><animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.42;0.58;0.68" values="1.5;2.5;1.5;2.5;1.5"/></rect><text x="607.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">verify</text><rect x="680" y="219" width="98" height="34" rx="17" fill="#162033" stroke="#a3b0c6" stroke-width="1.5"></rect><text x="729.0" y="241" text-anchor="middle" font-size="14" fill="#a3b0c6">decide</text>

  <!-- retry arc -->
  <line x1="119.0" y1="270" x2="851" y2="270" stroke="#3a4a68" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>
  <path d="M607.0 270 C607.0 322 485.0 322 485.0 272" fill="none" stroke="#e6a54a" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#ah)" opacity="0.6"/>
  <text x="546.0" y="328" text-anchor="middle" font-size="12" fill="#e6a54a" opacity="0.85">rejected, redraft</text>

  <!-- done pill -->
  <g>
    <rect x="802" y="214" width="98" height="44" rx="22" fill="#4cc198" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.82;0.995" values="0;1;0"/>
    </rect>
    <rect x="802" y="219" width="98" height="34" rx="17" fill="#4cc198"/>
    <text x="851" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1726">shipped</text>
  </g>

  <!-- verifier callouts -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3;0.44" values="0;1;0"/>
    <rect x="495.0" y="162" width="224" height="40" rx="6" fill="#162033" stroke="#f0806f"/>
    <text x="607.0" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f0806f">✕ ₹14,041 not on any cited record</text>
    <text x="607.0" y="195" text-anchor="middle" font-size="11.5" fill="#a3b0c6">verifier blocks the note</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.58;0.72" values="0;1;0"/>
    <rect x="495.0" y="162" width="224" height="40" rx="6" fill="#162033" stroke="#4cc198"/>
    <text x="607.0" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4cc198">✓ 4 sentences, every value cited</text>
    <text x="607.0" y="195" text-anchor="middle" font-size="11.5" fill="#a3b0c6">draft 2 passes</text>
  </g>

  <!-- the dispute moving through -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.000;0.040;0.300;0.420;0.520;0.580;0.680;0.820;1.000" keyPoints="0.0000;0.0000;0.4810;0.4810;0.6392;0.7595;0.7595;1.0000;1.0000" path="M119.0 270 L607.0 270 C607.0 322 485.0 322 485.0 270 L607.0 270 L851 270"/>
    <circle r="7" cx="0" cy="0" fill="#e6ebf3">
      <animate attributeName="fill" dur="10s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.30;0.52;0.82" values="#e6ebf3;#f0806f;#e6ebf3;#4cc198"/>
    </circle>
    <text x="12" y="4" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#e6ebf3">D005</text>
  </g>

  <text x="70" y="362" font-size="12" fill="#a3b0c6">One dispute through the agent in <tspan font-weight="700">grounded-triage</tspan>, replayed from the 40% fabrication eval run.</text>
</svg>
