<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Shahabaj Sheikh, forward-deployed AI engineer. Animation: a dispute moves through an agent's states; a fabricated amount is rejected at verify, redrafted, verified and shipped with zero fabrications.">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#c3ccd8"/></marker>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a15c00"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="960" height="384" rx="14" fill="#f3f5f7"/>

  <text x="70" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#14213d">Shahabaj Sheikh</text>
  <text x="70" y="124" font-size="19" fill="#4a5873">Forward-deployed AI engineer. I take agentic systems from discovery to production</text>
  <text x="70" y="150" font-size="19" fill="#4a5873">inside enterprises where a wrong answer has a cost.</text>
  <line x1="70" y1="176" x2="890" y2="176" stroke="#c3ccd8"/>

  <line x1="172" y1="236" x2="188" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/><line x1="294" y1="236" x2="310" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/><line x1="416" y1="236" x2="432" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/><line x1="538" y1="236" x2="554" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/><line x1="660" y1="236" x2="676" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/><line x1="782" y1="236" x2="798" y2="236" stroke="#c3ccd8" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="70" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"></rect><text x="119.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">intake</text><rect x="192" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"></rect><text x="241.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">gather</text><rect x="314" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"></rect><text x="363.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">classify</text><rect x="436" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"></rect><text x="485.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">draft</text><rect x="558" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"><animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.42;0.58;0.68" values="#4a5873;#b42318;#4a5873;#1f7a5c;#4a5873"/><animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.42;0.58;0.68" values="1.5;2.5;1.5;2.5;1.5"/></rect><text x="607.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">verify</text><rect x="680" y="219" width="98" height="34" rx="17" fill="#ffffff" stroke="#4a5873" stroke-width="1.5"></rect><text x="729.0" y="241" text-anchor="middle" font-size="14" fill="#4a5873">decide</text>

  <!-- retry arc -->
  <line x1="119.0" y1="270" x2="851" y2="270" stroke="#c3ccd8" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>
  <path d="M607.0 270 C607.0 322 485.0 322 485.0 272" fill="none" stroke="#a15c00" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#ah)" opacity="0.6"/>
  <text x="546.0" y="328" text-anchor="middle" font-size="12" fill="#a15c00" opacity="0.85">rejected, redraft</text>

  <!-- done pill -->
  <g>
    <rect x="802" y="214" width="98" height="44" rx="22" fill="#1f7a5c" filter="url(#glow)" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.82;0.995" values="0;1;0"/>
    </rect>
    <rect x="802" y="219" width="98" height="34" rx="17" fill="#1f7a5c"/>
    <text x="851" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#f3f5f7">shipped</text>
  </g>

  <!-- verifier callouts -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3;0.44" values="0;1;0"/>
    <rect x="495.0" y="162" width="224" height="40" rx="6" fill="#ffffff" stroke="#b42318"/>
    <text x="607.0" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b42318">✕ ₹14,041 not on any cited record</text>
    <text x="607.0" y="195" text-anchor="middle" font-size="11.5" fill="#4a5873">verifier blocks the note</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.58;0.72" values="0;1;0"/>
    <rect x="495.0" y="162" width="224" height="40" rx="6" fill="#ffffff" stroke="#1f7a5c"/>
    <text x="607.0" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f7a5c">✓ 4 sentences, every value cited</text>
    <text x="607.0" y="195" text-anchor="middle" font-size="11.5" fill="#4a5873">draft 2 passes</text>
  </g>

  <!-- the dispute moving through -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.000;0.040;0.300;0.420;0.520;0.580;0.680;0.820;1.000" keyPoints="0.0000;0.0000;0.4810;0.4810;0.6392;0.7595;0.7595;1.0000;1.0000" path="M119.0 270 L607.0 270 C607.0 322 485.0 322 485.0 270 L607.0 270 L851 270"/>
    <circle r="7" cx="0" cy="0" fill="#14213d">
      <animate attributeName="fill" dur="10s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.30;0.52;0.82" values="#14213d;#b42318;#14213d;#1f7a5c"/>
    </circle>
    <text x="12" y="4" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#14213d">D005</text>
  </g>

  <text x="70" y="362" font-size="12" fill="#4a5873">One dispute through the agent in <tspan font-weight="700">grounded-triage</tspan>, replayed from the 40% fabrication eval run.</text>
</svg>
