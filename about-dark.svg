  <circle cx="40" cy="17" r="5.5" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="58" cy="17" r="5.5" fill="#ffffff" fill-opacity="0.18"/>
  <text x="280.0" y="22" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7d8aa3">about_me.py</text>
  <text x="52" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#c792ea">class </tspan><tspan fill="#ffcb6b">Shahabaj</tspan><tspan fill="#e6ebf3">(</tspan><tspan fill="#ffcb6b">ForwardDeployedEngineer</tspan><tspan fill="#e6ebf3">):</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.019;0.97" values="0;1;0"/></text><text x="22" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">1</text><text x="52" y="82" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">    based_in  = </tspan><tspan fill="#c3e88d">"Gurugram, India"</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.041;0.97" values="0;1;0"/></text><text x="22" y="82" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">2</text><text x="52" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">    role      = </tspan><tspan fill="#c3e88d">"AI Solutions Architect @ DevRev"</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.062;0.97" values="0;1;0"/></text><text x="22" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">3</text><text x="52" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">    years     = </tspan><tspan fill="#f78c6c">14</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.084;0.97" values="0;1;0"/></text><text x="22" y="126" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">4</text><text x="52" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">    domains   = [</tspan><tspan fill="#c3e88d">"airlines"</tspan><tspan fill="#e6ebf3">, </tspan><tspan fill="#c3e88d">"banking"</tspan><tspan fill="#e6ebf3">, </tspan><tspan fill="#c3e88d">"fintech"</tspan><tspan fill="#e6ebf3">, </tspan><tspan fill="#c3e88d">"pricing"</tspan><tspan fill="#e6ebf3">]</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.106;0.97" values="0;1;0"/></text><text x="22" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">5</text><text x="52" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">    speaks    = [</tspan><tspan fill="#c3e88d">"English"</tspan><tspan fill="#e6ebf3">, </tspan><tspan fill="#c3e88d">"Hindi"</tspan><tspan fill="#e6ebf3">, </tspan><tspan fill="#c3e88d">"Bengali"</tspan><tspan fill="#e6ebf3">]</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.128;0.97" values="0;1;0"/></text><text x="22" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">6</text><text x="52" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.150;0.97" values="0;1;0"/></text><text x="22" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">7</text><text x="52" y="214" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#c792ea">    def </tspan><tspan fill="#82aaff">engage</tspan><tspan fill="#e6ebf3">(self, client):</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.172;0.97" values="0;1;0"/></text><text x="22" y="214" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">8</text><text x="52" y="236" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">        problem = self.</tspan><tspan fill="#82aaff">discover</tspan><tspan fill="#e6ebf3">(client)</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.194;0.97" values="0;1;0"/></text><text x="22" y="236" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">9</text><text x="52" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">        agent = self.</tspan><tspan fill="#82aaff">build</tspan><tspan fill="#e6ebf3">(problem)</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.216;0.97" values="0;1;0"/></text><text x="22" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">10</text><text x="52" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#c792ea">        while not </tspan><tspan fill="#e6ebf3">self.</tspan><tspan fill="#82aaff">evals</tspan><tspan fill="#e6ebf3">(agent).</tspan><tspan fill="#82aaff">meet</tspan><tspan fill="#e6ebf3">(client.gates):</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.237;0.97" values="0;1;0"/></text><text x="22" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">11</text><text x="52" y="302" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#e6ebf3">            agent = self.</tspan><tspan fill="#82aaff">improve</tspan><tspan fill="#e6ebf3">(agent)</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.259;0.97" values="0;1;0"/></text><text x="22" y="302" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">12</text><text x="52" y="324" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve"><tspan fill="#c792ea">        return </tspan><tspan fill="#e6ebf3">self.</tspan><tspan fill="#82aaff">ship</tspan><tspan fill="#e6ebf3">(agent, mode=</tspan><tspan fill="#c3e88d">"shadow"</tspan><tspan fill="#e6ebf3">)</tspan><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.281;0.97" values="0;1;0"/></text><text x="22" y="324" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7d8aa3" opacity="0.6">13</text>
</svg>
