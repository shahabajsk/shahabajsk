<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="560" height="352" role="img" aria-label="About me, written as a Python class: based in Gurugram, AI Solutions Architect at DevRev, 14 years, airlines, banking, fintech and pricing; engages by discovering, building, iterating until evals pass the client's gates, then shipping in shadow mode.">
  <rect width="560" height="352" rx="10" fill="#0a101c"/>
  <line x1="0" y1="34" x2="560" y2="34" stroke="#ffffff" stroke-opacity="0.08"/>
